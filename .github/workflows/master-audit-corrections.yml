name: ARES Performance v7.0 Authority Audit

on:
  workflow_dispatch:
  push:
    branches: [main, 'construction/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authority-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Source governance audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'object OperatorProgramV56|SpeedVariant|EngineVariant|manualDeloadMode|MachinePowerFinisher|splitForWeek|conditioningForWeek' app/src/main/java
          grep -q 'startV70' app/src/main/java/com/jk/operatorperformance/state/ProgramStateStore.kt
          grep -q 'Existing v5.7 data is preserved and is not silently mapped' app/src/main/java/com/jk/operatorperformance/ui/OperatorPerformanceApp.kt
          grep -q '4, 8 -> listOf(restRow(day))' app/src/main/java/com/jk/operatorperformance/program/SessionResolver.kt
          grep -q 'cycle in setOf(7,14,21)' app/src/main/java/com/jk/operatorperformance/program/ProgramV70.kt
          grep -q 'cycle in setOf(26,27)' app/src/main/java/com/jk/operatorperformance/program/ProgramV70.kt
          grep -q 'cycle == 28' app/src/main/java/com/jk/operatorperformance/program/ProgramV70.kt

      - name: Canonical v7.0 audit tests
        run: gradle :app:testDebugUnitTest --tests '*ProgramV70Test' --tests '*ProgramUiStateV70Test' --stacktrace

      - name: Write provenance
        shell: bash
        run: |
          mkdir -p app/build/reports
          {
            echo 'ARES PERFORMANCE v7.0 AUTHORITY AUDIT'
            echo "commit=$GITHUB_SHA"
            echo 'package=com.jk.operatorperformance'
            echo 'versionName=0.37.0'
            echo 'versionCode=46'
            echo 'authorityVersion=7.0'
            echo 'authoritySha256=0f9bd7981dc0671e836165a2b3efa70113c09cfb26e76ffc9c623ebc452dcca0'
            echo 'topology=28 cycles x 8 days = 224 days'
            echo 'releaseAction=NONE'
          } > app/build/reports/v70-authority-provenance.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ARES-v7.0-authority-audit-${{ github.sha }}
          path: |
            app/build/reports/v70-authority-provenance.txt
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
