name: Operator Performance v5.4 Master Audit Corrections

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'construction/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  master-audit-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API and emulator support
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Verify local-only privacy configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/data_extraction_rules.xml
          test -f app/src/main/res/xml/backup_rules.xml
          grep -q '<cloud-backup>' app/src/main/res/xml/data_extraction_rules.xml
          grep -q '<device-transfer>' app/src/main/res/xml/data_extraction_rules.xml
          for domain in root file database sharedpref external; do
            test "$(grep -c "<exclude domain=\"$domain\" path=\"\.\"" app/src/main/res/xml/data_extraction_rules.xml)" -eq 2
            grep -q "<exclude domain=\"$domain\" path=\"\.\"" app/src/main/res/xml/backup_rules.xml
          done

      - name: Build current debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Full internal source and APK boundary scan
        shell: bash
        run: |
          set -euo pipefail
          source_pattern='ESTABLISH CURRENT CAPABILITY|Recent runs per week|Easy continuous run capacity|Next-day lower-leg soreness|Pain currently changes my gait|PROGRAM TRACKING|PERFORMANCE PROFILE|HEALTH CONNECT|READINESS|SESSION RESULT|EASY / GOOD / HARD / FAILED|POSITION [1-7]|bodyweight|progress-photo|benchmark result entry|RECOVERY MODE|HISTORY destination|sled push|sled pull|Speed \\+ sled|ProgramTrackingStore|ReadinessStore|BenchmarkStore|StrengthLog|RunStopwatchStore|ConditioningExecutionStore|ActiveSetProgressStore|actualLoad|actualReps|actualRir|performed load|performed reps|performed RIR|session score|workout rating|automatic progression|block recomposition'
          if grep -RniE "$source_pattern" app/src/main/java app/src/main/res; then
            echo "Stale/prohibited runtime architecture reference found in production source" >&2
            exit 1
          fi

          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          permission_pattern='android.permission.INTERNET|android.permission.POST_NOTIFICATIONS|android.permission.health|HealthConnect'
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            permissions="$($aapt2 dump permissions "$apk")"
            if grep -Ei "$permission_pattern" <<< "$permissions"; then
              echo "Prohibited permission found in APK manifest: $apk" >&2
              exit 1
            fi
            if unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings | grep -Ei "$source_pattern"; then
              echo "Stale runtime architecture reference found in APK bytecode: $apk" >&2
              exit 1
            fi
          done

      - name: True process-death focus and timer restoration acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          emulator_log="$RUNNER_TEMP/operator-master-audit-emulator.log"
          avd_dir="$HOME/.android/avd/operator-master-audit-api35.avd"
          echo no | avdmanager create avd \
            --force \
            --name operator-master-audit-api35 \
            --package "system-images;android-35;default;x86_64" \
            --device "pixel_2"
          printf '\ndisk.dataPartition.size=2048M\n' >> "$avd_dir/config.ini"
          "$ANDROID_HOME/emulator/emulator" \
            -avd operator-master-audit-api35 \
            -partition-size 2048 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -accel on > "$emulator_log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          timeout 90 adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          apk="app/build/outputs/apk/debug/app-debug.apk"
          adb install "$apk"
          adb shell pm clear com.jk.operatorperformance >/dev/null
          adb shell am start -W -n com.jk.operatorperformance/.MainActivity >/dev/null
          adb shell am force-stop com.jk.operatorperformance

          timer_end_ms=$(( $(date +%s%3N) + 300000 ))
          state_file="$RUNNER_TEMP/operator_v54_reference_state.xml"
          cat > "$state_file" <<EOF
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
              <int name="currentWeek" value="1" />
              <int name="currentDay" value="1" />
              <string name="manualSpeedVariant">ACCELERATION</string>
              <string name="manualEngineVariant">THRESHOLD</string>
              <boolean name="manualDeloadMode" value="false" />
              <int name="manualRestTimerSeconds" value="120" />
              <boolean name="machineInventoryConfigured" value="false" />
              <boolean name="workoutActive" value="true" />
              <int name="workoutWeek" value="1" />
              <int name="workoutDay" value="1" />
              <string name="workoutSpeedVariant">ACCELERATION</string>
              <string name="workoutEngineVariant">THRESHOLD</string>
              <boolean name="workoutDeloadMode" value="false" />
              <boolean name="workoutMachineInventoryConfigured" value="false" />
              <int name="workoutMovementIndex" value="0" />
              <int name="workoutEffortIndex" value="2" />
              <boolean name="workoutComplete" value="false" />
              <long name="workoutRestTimerEndEpochMillis" value="$timer_end_ms" />
              <boolean name="workoutHasUndo" value="true" />
              <int name="workoutUndoMovementIndex" value="0" />
              <int name="workoutUndoEffortIndex" value="1" />
              <boolean name="workoutUndoComplete" value="false" />
              <boolean name="migrationV54Complete" value="true" />
          </map>
          EOF
          sed -i 's/^          //' "$state_file"
          cat "$state_file" | adb shell run-as com.jk.operatorperformance sh -c 'cat > shared_prefs/operator_v54_reference_state.xml'

          adb shell am start -W -n com.jk.operatorperformance/.MainActivity >/dev/null
          sleep 1
          adb shell am force-stop com.jk.operatorperformance
          test -z "$(adb shell pidof com.jk.operatorperformance 2>/dev/null | tr -d '\r')"
          adb shell am start -W -n com.jk.operatorperformance/.MainActivity >/dev/null
          sleep 1

          find_text_and_tap() {
            local wanted="$1"
            local dump="$RUNNER_TEMP/window.xml"
            local coords=""
            for _ in $(seq 1 12); do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$dump" >/dev/null
              coords="$(python3 - "$dump" "$wanted" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          wanted = sys.argv[2]
          for node in root.iter('node'):
              if node.attrib.get('text') == wanted:
                  m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if m:
                      x1, y1, x2, y2 = map(int, m.groups())
                      print(f'{(x1+x2)//2} {(y1+y2)//2}')
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
              )" && break || true
              adb shell input swipe 540 1500 540 500 250
              sleep 0.3
            done
            test -n "$coords"
            adb shell input tap $coords
          }

          find_text_and_tap "RESUME WORKOUT"
          sleep 1
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml "$RUNNER_TEMP/resumed.xml" >/dev/null
          grep -q 'text="SET 2 OF 4"' "$RUNNER_TEMP/resumed.xml"

          restored_state="$(adb shell run-as com.jk.operatorperformance cat shared_prefs/operator_v54_reference_state.xml | tr -d '\r')"
          grep -q 'name="workoutMovementIndex" value="0"' <<< "$restored_state"
          grep -q 'name="workoutEffortIndex" value="2"' <<< "$restored_state"
          grep -q "name=\"workoutRestTimerEndEpochMillis\" value=\"$timer_end_ms\"" <<< "$restored_state"

      - name: Upload master-audit correction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Operator-Performance-Master-Audit-Corrections
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
