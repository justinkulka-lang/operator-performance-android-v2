name: Apply ARES v7.1 stable SDK overlay

on:
  push:
    branches: [construction/ares-v7-unified-authority]
    paths: [.github/workflows/ares-v71-stable-sdk-overlay.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply stable Android SDK overlay
        shell: bash
        run: base64 --decode .github/workflows/ares-v71-stable-sdk-overlay.b64 | tar -xzf -
      - name: Commit stable toolchain correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts .github/workflows/android-ci.yml .github/workflows/master-audit-corrections.yml
          git diff --cached --check
          git commit -m "Align v7.1 with stable Android 36 toolchain"
          git push origin HEAD:construction/ares-v7-unified-authority
