name: Apply ARES v7.1 SDK 37 overlay

on:
  push:
    branches: [construction/ares-v7-unified-authority]
    paths: [.github/workflows/apply-v71-build-overlay-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: base64 --decode .github/v71-build-overlay-v2.b64 | tar -xzf -
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --cached --check
          git commit -m "Compile v7.1 against Android 37"
          git push origin HEAD:construction/ares-v7-unified-authority
