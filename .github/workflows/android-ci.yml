name: Operator Performance v5.4 Reference UI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'construction/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android API and emulator support
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "emulator" \
            "system-images;android-35;default;x86_64"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/system-images/android-35/default/x86_64/system.img"

      - name: Verify package, version, and offline manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.jk.operatorperformance"' app/build.gradle.kts
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "0.35.0"' app/build.gradle.kts
          if grep -Eq 'android.permission.INTERNET|android.permission.health|HealthConnect' app/src/main/AndroidManifest.xml; then
            echo "Prohibited network/health permission found in manifest" >&2
            exit 1
          fi

      - name: Source stale-architecture and design-boundary scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='ESTABLISH CURRENT CAPABILITY|Recent runs per week|Easy continuous run capacity|Next-day lower-leg soreness|Pain currently changes my gait|PROGRAM TRACKING|PERFORMANCE PROFILE|HEALTH CONNECT|READINESS|SESSION RESULT|EASY / GOOD / HARD / FAILED|POSITION [1-7]|bodyweight|progress-photo|benchmark result entry|RECOVERY MODE|HISTORY destination|sled push|sled pull|Speed \\+ sled'
          if grep -RniE "$pattern" app/src/main/java app/src/main/res; then
            echo "Stale/prohibited runtime architecture reference found in production source" >&2
            exit 1
          fi

      - name: Run canonical program and reference-state unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify computed program exports
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/reports/program-matrix.csv
          test -f app/build/reports/program-resistance-rows.csv
          test -f app/build/reports/program-weeks-1-32.csv
          grep -q 'Quads,13.0,2,10.0,2' app/build/reports/program-matrix.csv
          grep -q '^1,Block 1,POPULATED,"13 / 11.5 / 11.5 / 12 / 12 / 11 / 15 / 11.5 / 12 / 10 / 9 / 9.5 / 10",148.0,1.667$' app/build/reports/program-weeks-1-32.csv
          grep -q '^9,Block 2,UNPOPULATED,—,—,—$' app/build/reports/program-weeks-1-32.csv
          grep -q '^32,Block 4,UNPOPULATED,—,—,—$' app/build/reports/program-weeks-1-32.csv

      - name: Run reference UI instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          emulator_log="$RUNNER_TEMP/operator-emulator.log"
          avd_dir="$HOME/.android/avd/operator-ci-api35.avd"
          echo no | avdmanager create avd \
            --force \
            --name operator-ci-api35 \
            --package "system-images;android-35;default;x86_64" \
            --device "pixel_2"
          printf '\ndisk.dataPartition.size=2048M\n' >> "$avd_dir/config.ini"
          grep -q '^disk.dataPartition.size=2048M$' "$avd_dir/config.ini"
          "$ANDROID_HOME/emulator/emulator" \
            -avd operator-ci-api35 \
            -partition-size 2048 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -accel on > "$emulator_log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          if ! timeout 90 adb wait-for-device; then
            echo "Emulator did not become visible to adb within 90 seconds." >&2
            adb devices -l || true
            cat "$emulator_log" || true
            exit 1
          fi

          if ! timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'; then
            echo "Emulator did not complete boot within 240 seconds." >&2
            adb devices -l || true
            cat "$emulator_log" || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          if ! timeout 600 gradle :app:connectedDebugAndroidTest --stacktrace; then
            echo "Instrumentation tests failed or exceeded 600 seconds." >&2
            adb devices -l || true
            cat "$emulator_log" || true
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: APK stale-architecture scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='ESTABLISH CURRENT CAPABILITY|Recent runs per week|PROGRAM TRACKING|PERFORMANCE PROFILE|HEALTH CONNECT|READINESS|SESSION RESULT|RECOVERY MODE|Speed \\+ sled'
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            if unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings | grep -Ei "$pattern"; then
              echo "Stale runtime reference found in $apk" >&2
              exit 1
            fi
          done

      - name: Capture dependency graph
        run: gradle :app:dependencies > app/build/reports/dependencies.txt

      - name: Upload Pass 6 artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Operator-Performance-Pass-6
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/program-matrix.csv
            app/build/reports/program-resistance-rows.csv
            app/build/reports/program-weeks-1-32.csv
            app/build/reports/dependencies.txt
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
