name: LEGEND versioned candidate

on:
  workflow_dispatch:
  push:
    branches: [main, 'construction/**', 'cursor/**', 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: legend-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: SDK and source identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s  %s\n' '25a7ce497569913c4a56c057bcaa139290adddf20876a2d736790d5fefd436f3' 'docs/ARES_Performance_Unified_Master_Authority_v7.2_APPROVED.docx' | sha256sum -c -
          git diff --exit-code 28944300f1e73015c70b8e342bcc90173022cd25 -- app/src/main/java/com/jk/operatorperformance/program/ProgramV56.kt app/src/main/java/com/jk/operatorperformance/program/ProgramV70.kt app/src/main/java/com/jk/operatorperformance/program/ProgramV71.kt app/src/main/java/com/jk/operatorperformance/program/ProgramV72.kt app/src/main/java/com/jk/operatorperformance/program/SessionResolverV72.kt app/src/main/java/com/jk/operatorperformance/program/ProgramNotesV71.kt app/src/main/java/com/jk/operatorperformance/program/ProgramNotesV72.kt app/src/test/resources/program-baseline.tsv
          git diff --exit-code 7cd35a5a8a47d52acb8cc84b472067604c269d69 -- app/src/main/java/com/jk/operatorperformance/program/ProgramV73.kt app/src/main/java/com/jk/operatorperformance/program/SessionResolverV73.kt app/src/main/java/com/jk/operatorperformance/program/ProgramNotesV73.kt
          (cd docs/legend-v73 && sha256sum -c SHA256SUMS.txt)
          printf '%s  %s\n' 'fbf181887806d14f6c02d9fb297e10a100952aee19853f3c2a1b822b0ed55edc' 'app/src/main/java/com/jk/operatorperformance/program/ProgramV72.kt' | sha256sum -c -
          printf '%s  %s\n' '7e1ec7d27b9e4ec9cde468b0fef93e3f6f636d3e4cf6ec738b466bd2fd2d2a59' 'app/src/main/java/com/jk/operatorperformance/program/SessionResolverV72.kt' | sha256sum -c -
      - name: Unit suite, exact program parity, lint, and debug APKs
        run: GITHUB_SHA="$SOURCE_COMMIT" gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Release signing fails closed without owner credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/reports/signing
          for task in assembleRelease bundleRelease; do
            if env -u OPERATOR_RELEASE_KEYSTORE_PATH -u OPERATOR_RELEASE_STORE_PASSWORD -u OPERATOR_RELEASE_KEY_ALIAS -u OPERATOR_RELEASE_KEY_PASSWORD gradle ":app:$task" > "app/build/reports/signing/$task.log" 2>&1; then
              echo "Unsigned release path succeeded: $task" >&2
              exit 1
            fi
            grep -F 'RELEASE_SIGNING_REQUIRED' "app/build/reports/signing/$task.log"
          done
          test ! -d app/build/outputs/apk/release
          test ! -d app/build/outputs/bundle/release
      - name: Full emulator suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          GITHUB_SHA="$SOURCE_COMMIT" gradle :app:pixel2api35DebugAndroidTest --stacktrace
          mkdir -p app/build/reports/full-emulator-suite
          cp -a app/build/outputs/androidTest-results/managedDevice app/build/reports/full-emulator-suite/results
          cp -a app/build/reports/androidTests/managedDevice app/build/reports/full-emulator-suite/html
          if [[ -d app/build/outputs/managed_device_android_test_additional_output ]]; then
            cp -a app/build/outputs/managed_device_android_test_additional_output app/build/reports/full-emulator-suite/screenshots
          fi
      - name: Repeat Key lifecycle suite five times without retries
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            GITHUB_SHA="$SOURCE_COMMIT" gradle :app:pixel2api35DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jk.operatorperformance.V72KeyUiTest --rerun-tasks --stacktrace
            mkdir -p "app/build/reports/key-stability/$pass"
            cp -a app/build/outputs/androidTest-results/managedDevice/. "app/build/reports/key-stability/$pass/"
          done
      - name: Same-certificate upgrade, force-stop, and emulator reboot
        run: bash .github/scripts/upgrade-emulator-acceptance.sh "$SOURCE_COMMIT"
      - name: v7.3 Week 12 upgrade on a fresh emulator
        run: bash .github/scripts/upgrade-v73-emulator-acceptance.sh "$SOURCE_COMMIT"
      - name: Verify and package the matching debug candidate
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/package-debug-candidate.sh "$SOURCE_COMMIT"
      - name: Downloadable debug APK and ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legend-debug-${{ env.SOURCE_COMMIT }}-attempt-${{ github.run_attempt }}
          path: app/build/distribution/
          if-no-files-found: error
          retention-days: 90
      - name: Signed release APK
        id: signed_release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          LEGEND_RELEASE_KEYSTORE_B64: ${{ secrets.LEGEND_RELEASE_KEYSTORE_B64 }}
          LEGEND_RELEASE_STORE_PASSWORD: ${{ secrets.LEGEND_RELEASE_STORE_PASSWORD }}
          LEGEND_RELEASE_KEY_ALIAS: ${{ secrets.LEGEND_RELEASE_KEY_ALIAS }}
          LEGEND_RELEASE_KEY_PASSWORD: ${{ secrets.LEGEND_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEGEND_RELEASE_KEYSTORE_B64:-}" || -z "${LEGEND_RELEASE_STORE_PASSWORD:-}" || -z "${LEGEND_RELEASE_KEY_ALIAS:-}" || -z "${LEGEND_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Owner release secrets are not set. Skipping the signed release APK."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          bash .github/scripts/package-signed-release.sh "$SOURCE_COMMIT"
      - name: Downloadable signed release APK
        if: steps.signed_release.outputs.signed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legend-release-${{ env.SOURCE_COMMIT }}-attempt-${{ github.run_attempt }}
          path: app/build/distribution-release/
          if-no-files-found: error
          retention-days: 90
      - name: Verification evidence (failures are retained)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legend-evidence-${{ env.SOURCE_COMMIT }}-attempt-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 90
